<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail Relay</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202b;--mute:#5d6b7a;--line:#d8dee5;--btn:#1f3a5f;--btnt:#fff;--ok:#0f7b6c;--warn:#b7791f;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#97a4b1;--line:#2a3541;--btn:#7aa7e0;--btnt:#0b1522;--ok:#3cc3ad;--warn:#e0a84a;--bad:#ef7b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--mute);font-size:.9rem;word-break:break-all;margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)}
.dot.connected{background:var(--ok)}.dot.auth_failed{background:var(--bad)}
.info{flex:1;min-width:0}
.info b{display:block;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mute)}
.err{color:var(--bad)}
input{width:100%;padding:11px;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 10px;font-size:.85rem}
button:focus-visible,input:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
h2{font-size:1rem;margin:0 0 10px}
#msg{min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.empty{color:var(--mute);margin:4px 0}
</style>
</head>
<body>
<main>
  <h1>Gmail Relay</h1>
  <p class="sub">নতুন mail যাবে: <span id="hook">…</span></p>

  <div class="box">
    <h2>Gmail accounts</h2>
    <div id="list"><p class="empty">লোড হচ্ছে…</p></div>
  </div>

  <div class="box">
    <h2>নতুন account যোগ করুন</h2>
    <input id="email" type="email" placeholder="Gmail address" autocomplete="off">
    <input id="pass" type="password" placeholder="Google App Password (16 অক্ষর)" autocomplete="off">
    <button id="add">Account যোগ করুন</button>
    <p id="msg"></p>
  </div>

  <button class="ghost" id="test">Webhook এ test পাঠান</button>
</main>
<script>
const $ = (id) => document.getElementById(id);
const label = { connected: 'চালু', connecting: 'সংযোগ হচ্ছে', reconnecting: 'আবার সংযোগ হচ্ছে', auth_failed: 'Login ব্যর্থ' };
const say = (t, bad) => { $('msg').textContent = t; $('msg').className = bad ? 'err' : ''; };

async function load() {
  const s = await (await fetch('/api/state')).json();
  $('hook').textContent = s.webhook;
  const list = $('list');
  list.replaceChildren();
  if (!s.accounts.length) { list.innerHTML = '<p class="empty">এখনো কোনো account নেই। নিচে যোগ করুন।</p>'; return; }
  for (const a of s.accounts) {
    const row = document.createElement('div'); row.className = 'row';
    const dot = document.createElement('span'); dot.className = 'dot ' + (a.status || '');
    const info = document.createElement('div'); info.className = 'info';
    const b = document.createElement('b'); b.textContent = a.email;
    const sm = document.createElement('small');
    sm.textContent = (label[a.status] || a.status) + ' · পাঠানো হয়েছে ' + (a.count || 0) + 'টা' +
      (a.lastMail ? ' · শেষ ' + new Date(a.lastMail).toLocaleTimeString() : '');
    info.append(b, sm);
    if (a.error) { const e = document.createElement('small'); e.className = 'err'; e.style.display = 'block'; e.textContent = a.error; info.append(e); }
    const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'সরান';
    del.onclick = async () => { if (confirm(a.email + ' সরাবেন?')) { await fetch('/api/accounts/' + encodeURIComponent(a.email), { method: 'DELETE' }); load(); } };
    row.append(dot, info, del); list.append(row);
  }
}

$('add').onclick = async () => {
  say('যাচাই হচ্ছে…');
  const r = await fetch('/api/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: $('email').value, password: $('pass').value }) });
  const d = await r.json();
  if (!r.ok) return say(d.error, true);
  $('email').value = ''; $('pass').value = ''; say('যোগ হয়েছে।'); load();
};
$('test').onclick = async () => {
  const r = await fetch('/api/test', { method: 'POST' }); const d = await r.json();
  say(r.ok ? 'Test পাঠানো হয়েছে।' : d.error, !r.ok);
};
load(); setInterval(load, 5000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
